<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Emergency Triage</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: #1e293b;
            border-radius: 12px;
            padding: 40px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.3);
        }

        h1 {
            font-size: 24px;
            margin-bottom: 8px;
            color: #f8fafc;
        }

        p.subtitle {
            color: #94a3b8;
            margin-bottom: 32px;
            font-size: 14px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #cbd5e1;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #e2e8f0;
            font-size: 14px;
            margin-bottom: 20px;
            outline: none;
        }

        input:focus, textarea:focus {
            border-color: #3b82f6;
        }

        textarea { height: 100px; resize: vertical; }

        button {
            width: 100%;
            padding: 14px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover { background: #2563eb; }
        button:disabled { background: #475569; cursor: not-allowed; }

        .result {
            margin-top: 32px;
            padding: 24px;
            border-radius: 8px;
            display: none;
        }

        .CRITICAL { background: #450a0a; border: 1px solid #ef4444; }
        .URGENT { background: #431407; border: 1px solid #f97316; }
        .STABLE { background: #052e16; border: 1px solid #22c55e; }

        .severity-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 16px;
        }

        .CRITICAL .severity-badge { background: #ef4444; }
        .URGENT .severity-badge { background: #f97316; }
        .STABLE .severity-badge { background: #22c55e; color: #000; }

        .result h3 { margin-bottom: 8px; font-size: 18px; }
        .result p { font-size: 14px; color: #cbd5e1; line-height: 1.6; }
        .result .label { color: #94a3b8; font-size: 12px; margin-top: 12px; }

        .loading { text-align: center; color: #94a3b8; margin-top: 20px; display: none; }
        .error { background: #450a0a; border: 1px solid #ef4444; padding: 16px; border-radius: 8px; margin-top: 20px; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚑 AI Emergency Triage</h1>
        <p class="subtitle">Enter patient details for AI-powered symptom analysis</p>

        <label>Patient Name</label>
        <input type="text" id="name" placeholder="e.g. John Doe">

        <label>Age</label>
        <input type="number" id="age" placeholder="e.g. 45">

        <label>Symptoms</label>
        <textarea id="symptoms" placeholder="Describe the patient's symptoms in detail..."></textarea>

        <button onclick="analyse()" id="btn">Analyse Symptoms</button>

        <div class="loading" id="loading">⏳ Analysing symptoms...</div>
        <div class="error" id="error"></div>

        <div class="result" id="result">
            <span class="severity-badge" id="severity"></span>
            <h3 id="condition"></h3>
            <p class="label">IMMEDIATE ACTION</p>
            <p id="action"></p>
        </div>
    </div>

    <script>
        async function analyse() {
            const name = document.getElementById('name').value;
            const age = document.getElementById('age').value;
            const symptoms = document.getElementById('symptoms').value;
            const btn = document.getElementById('btn');
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            const result = document.getElementById('result');

            // Basic validation
            if (!name || !age || !symptoms) {
                error.textContent = "Please fill in all fields";
                error.style.display = "block";
                return;
            }

            // Reset UI
            error.style.display = "none";
            result.style.display = "none";
            loading.style.display = "block";
            btn.disabled = true;
            btn.textContent = "Analysing...";

            try {
                const response = await fetch("http://127.0.0.1:8000/triage", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "X-API-Key": "mysecretkey123"
                    },
                    body: JSON.stringify({
                        name: name,
                        age: parseInt(age),
                        symptoms: symptoms
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || "Something went wrong");
                }

                // Display result
                const severity = data.diagnosis.severity;
                result.className = `result ${severity}`;
                document.getElementById('severity').textContent = severity;
                document.getElementById('condition').textContent = data.diagnosis.condition;
                document.getElementById('action').textContent = data.diagnosis.immediate_action;
                result.style.display = "block";

            } catch (err) {
                error.textContent = err.message;
                error.style.display = "block";
            } finally {
                loading.style.display = "none";
                btn.disabled = false;
                btn.textContent = "Analyse Symptoms";
            }
        }
    </script>
</body>
</html>
