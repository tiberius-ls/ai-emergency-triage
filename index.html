<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Emergency Triage</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
        }

        nav {
            background: #1e293b;
            padding: 16px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #334155;
        }

        nav h1 { font-size: 18px; color: #f8fafc; }

        nav .links a {
            color: #94a3b8;
            text-decoration: none;
            margin-left: 24px;
            font-size: 14px;
            cursor: pointer;
        }

        nav .links a:hover { color: #f8fafc; }
        nav .links a.active { color: #3b82f6; font-weight: bold; }

        .page { display: none; padding: 40px 20px; max-width: 700px; margin: 0 auto; }
        .page.active { display: block; }

        h2 { font-size: 22px; margin-bottom: 8px; }
        p.subtitle { color: #94a3b8; margin-bottom: 32px; font-size: 14px; }

        label { display: block; margin-bottom: 6px; font-size: 14px; color: #cbd5e1; }

        input, textarea {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #e2e8f0;
            font-size: 14px;
            margin-bottom: 20px;
            outline: none;
        }

        input:focus, textarea:focus { border-color: #3b82f6; }
        textarea { height: 100px; resize: vertical; }

        button {
            width: 100%;
            padding: 14px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover { background: #2563eb; }
        button:disabled { background: #475569; cursor: not-allowed; }

        .result {
            margin-top: 32px;
            padding: 24px;
            border-radius: 8px;
            display: none;
        }

        .CRITICAL { background: #450a0a; border: 1px solid #ef4444; }
        .URGENT { background: #431407; border: 1px solid #f97316; }
        .STABLE { background: #052e16; border: 1px solid #22c55e; }

        .severity-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 16px;
        }

        .CRITICAL .severity-badge { background: #ef4444; }
        .URGENT .severity-badge { background: #f97316; }
        .STABLE .severity-badge { background: #22c55e; color: #000; }

        .result h3 { margin-bottom: 8px; font-size: 18px; }
        .result p { font-size: 14px; color: #cbd5e1; line-height: 1.6; }
        .result .label { color: #94a3b8; font-size: 12px; margin-top: 12px; }

        .loading { text-align: center; color: #94a3b8; margin-top: 20px; display: none; }
        .error-msg { background: #450a0a; border: 1px solid #ef4444; padding: 16px; border-radius: 8px; margin-top: 20px; display: none; font-size: 14px; }

        /* Stats */
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: #1e293b;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
        }

        .stat-card .number { font-size: 32px; font-weight: bold; }
        .stat-card .name { font-size: 12px; color: #94a3b8; margin-top: 4px; }
        .critical-stat .number { color: #ef4444; }
        .urgent-stat .number { color: #f97316; }
        .stable-stat .number { color: #22c55e; }

        /* Records */
        .record-card {
            background: #1e293b;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 16px;
            border-left: 4px solid #334155;
        }

        .record-card.CRITICAL { border-left-color: #ef4444; }
        .record-card.URGENT { border-left-color: #f97316; }
        .record-card.STABLE { border-left-color: #22c55e; }

        .record-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .record-name { font-weight: bold; font-size: 16px; }
        .record-time { font-size: 12px; color: #94a3b8; }
        .record-condition { font-size: 14px; color: #cbd5e1; margin-bottom: 4px; }
        .record-symptoms { font-size: 12px; color: #64748b; }

        .badge {
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .badge.CRITICAL { background: #ef4444; color: white; }
        .badge.URGENT { background: #f97316; color: white; }
        .badge.STABLE { background: #22c55e; color: black; }

        .no-records { text-align: center; color: #64748b; padding: 40px; }
    </style>
</head>
<body>

<nav>
    <h1>🚑 AI Emergency Triage</h1>
    <div class="links">
        <a onclick="showPage('triage')" id="nav-triage" class="active">Triage</a>
        <a onclick="showPage('records')" id="nav-records">Records</a>
    </div>
</nav>

<!-- TRIAGE PAGE -->
<div class="page active" id="page-triage">
    <h2>Patient Triage</h2>
    <p class="subtitle">Enter patient details for AI-powered symptom analysis</p>

    <label>Patient Name</label>
    <input type="text" id="name" placeholder="e.g. John Doe">

    <label>Age</label>
    <input type="number" id="age" placeholder="e.g. 45">

    <label>Symptoms</label>
    <textarea id="symptoms" placeholder="Describe the patient's symptoms in detail..."></textarea>

    <button onclick="analyse()" id="btn">Analyse Symptoms</button>

    <div class="loading" id="loading">⏳ Analysing symptoms...</div>
    <div class="error-msg" id="error"></div>

    <div class="result" id="result">
        <span class="severity-badge" id="severity"></span>
        <h3 id="condition"></h3>
        <p class="label">IMMEDIATE ACTION</p>
        <p id="action"></p>
    </div>
</div>

<!-- RECORDS PAGE -->
<div class="page" id="page-records">
    <h2>Triage Records</h2>
    <p class="subtitle">All past triage assessments</p>

    <div class="stats">
        <div class="stat-card critical-stat">
            <div class="number" id="count-critical">0</div>
            <div class="name">CRITICAL</div>
        </div>
        <div class="stat-card urgent-stat">
            <div class="number" id="count-urgent">0</div>
            <div class="name">URGENT</div>
        </div>
        <div class="stat-card stable-stat">
            <div class="number" id="count-stable">0</div>
            <div class="name">STABLE</div>
        </div>
    </div>

    <div id="records-list"></div>
</div>

<script>
    const API = "http://127.0.0.1:8000";
    const API_KEY = "mysecretkey123";

    function showPage(page) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('nav .links a').forEach(a => a.classList.remove('active'));
        document.getElementById('page-' + page).classList.add('active');
        document.getElementById('nav-' + page).classList.add('active');
        if (page === 'records') loadRecords();
    }

    async function analyse() {
        const name = document.getElementById('name').value;
        const age = document.getElementById('age').value;
        const symptoms = document.getElementById('symptoms').value;
        const btn = document.getElementById('btn');
        const loading = document.getElementById('loading');
        const error = document.getElementById('error');
        const result = document.getElementById('result');

        if (!name || !age || !symptoms) {
            error.textContent = "Please fill in all fields";
            error.style.display = "block";
            return;
        }

        error.style.display = "none";
        result.style.display = "none";
        loading.style.display = "block";
        btn.disabled = true;
        btn.textContent = "Analysing...";

        try {
            const response = await fetch(`${API}/triage`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-API-Key": API_KEY
                },
                body: JSON.stringify({
                    name: name,
                    age: parseInt(age),
                    symptoms: symptoms
                })
            });

            const data = await response.json();

            if (!response.ok) throw new Error(data.detail || "Something went wrong");

            const severity = data.diagnosis.severity;
            result.className = `result ${severity}`;
            document.getElementById('severity').textContent = severity;
            document.getElementById('condition').textContent = data.diagnosis.condition;
            document.getElementById('action').textContent = data.diagnosis.immediate_action;
            result.style.display = "block";

        } catch (err) {
            error.textContent = err.message;
            error.style.display = "block";
        } finally {
            loading.style.display = "none";
            btn.disabled = false;
            btn.textContent = "Analyse Symptoms";
        }
    }

    async function loadRecords() {
        const list = document.getElementById('records-list');
        list.innerHTML = '<p style="color:#94a3b8;text-align:center">Loading records...</p>';

        try {
            const response = await fetch(`${API}/records`, {
                headers: { "X-API-Key": API_KEY }
            });

            const records = await response.json();

            // Count stats
            const counts = { CRITICAL: 0, URGENT: 0, STABLE: 0 };
            records.forEach(r => counts[r.severity] = (counts[r.severity] || 0) + 1);
            document.getElementById('count-critical').textContent = counts.CRITICAL;
            document.getElementById('count-urgent').textContent = counts.URGENT;
            document.getElementById('count-stable').textContent = counts.STABLE;

            if (records.length === 0) {
                list.innerHTML = '<div class="no-records">No records yet</div>';
                return;
            }

            list.innerHTML = records.reverse().map(r => `
                <div class="record-card ${r.severity}">
                    <div class="record-header">
                        <span class="record-name">${r.patient_name}</span>
                        <span class="badge ${r.severity}">${r.severity}</span>
                    </div>
                    <div class="record-condition">${r.condition}</div>
                    <div class="record-symptoms">Symptoms: ${r.symptoms}</div>
                    <div class="record-time">${new Date(r.created_at).toLocaleString()}</div>
                </div>
            `).join('');

        } catch (err) {
            list.innerHTML = `<div class="error-msg" style="display:block">${err.message}</div>`;
        }
    }
</script>
</body>
</html>
